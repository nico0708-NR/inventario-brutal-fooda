<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Brutal Food</title>

<style>

body{
    margin:0;
    background:#0d0d0d;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background:#161616;
    padding:40px;
    border-radius:20px;
    width:320px;
    text-align:center;
    border:1px solid #2a2a2a;
}

h2{
    color:#ff5a1f;
    margin-bottom:10px;
}

small{
    color:#888;
    display:block;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff5a1f;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.info{
    margin-top:15px;
    font-size:13px;
    color:#aaa;
    background:#111;
    padding:10px;
    border-radius:10px;
    border:1px solid #222;
}

</style>
</head>

<body>

<div class="box">

<h2>🔥 Brutal Food POS</h2>
<small>Sistema de restaurante</small>

<form method="POST">

    <input type="text" name="user" placeholder="Usuario" required>
    <input type="password" name="password" placeholder="Contraseña" required>

    <button>Entrar</button>

</form>

<div class="info">
<b>Demo login:</b><br>
Usuario: <b>nicolasjef</b><br>
Contraseña: <b>123450808</b>
</div>

</div>

</body>
</html>
