<!-- templates/login.html -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutal Food Login</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#111;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:#1e1e1e;
            padding:40px;
            border-radius:20px;
            width:320px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h1{
            color:#ff3c00;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:10px;
            background:#2c2c2c;
            color:white;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#ff3c00;
            color:white;
            font-size:17px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            opacity:0.9;
        }

    </style>

</head>
<body>

    <div class="login-box">

        <h1>🔥 Brutal Food</h1>

        <form method="POST">

            <input 
                type="text"
                name="user"
                placeholder="Usuario"
                required
            >

            <input 
                type="password"
                name="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>
</html>
